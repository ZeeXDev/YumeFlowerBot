<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès aux fichiers</title>
    
    <!-- 1. SDK MONETAG (le vrai) -->
    <script src='//libtl.com/sdk.js' data-zone='10518701' data-sdk='show_10518701'></script>
    
    <!-- 2. Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- ... garde tout ton HTML existant ... -->

    <!-- 3. Configuration API -->
    <script>
        // ⚠️ REMPLACE PAR TON URL RENDER !
        const API_BASE = 'https://test-cey.onrender.com';
        
        // Wrapper Monetag
        const Monetag = {
            show: () => {
                return new Promise((resolve, reject) => {
                    // Vérifier si la fonction existe
                    if (typeof show_10518701 !== 'function') {
                        console.error('SDK Monetag pas chargé');
                        reject('SDK not loaded');
                        return;
                    }
                    
                    // Appeler la pub
                    try {
                        show_10518701().then(() => {
                            console.log('✅ Pub visionnée');
                            resolve(true);
                        }).catch(() => {
                            console.log('❌ Pub fermée');
                            reject(false);
                        });
                    } catch(e) {
                        reject(e);
                    }
                });
            }
        };
    </script>

    <!-- 4. API Client -->
    <script>
        async function checkSession(userId, auth) {
            try {
                const res = await fetch(`${API_BASE}/api/check-session`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, auth: auth})
                });
                return await res.json();
            } catch(e) {
                return {has_access: false};
            }
        }

        async function activateSession(userId, auth) {
            try {
                const res = await fetch(`${API_BASE}/api/watch-ad`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, auth: auth})
                });
                return await res.json();
            } catch(e) {
                return {success: false};
            }
        }
    </script>

    <!-- 5. Logique principale -->
    <script>
        const tg = window.Telegram?.WebApp;
        
        async function handleWatchAd() {
            const btn = document.getElementById('watchAdBtn');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            
            // UI Loading
            btn.classList.add('hidden');
            loader.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            
            try {
                // 1. Afficher pub Monetag
                await Monetag.show();
                
                // 2. Pub regardée → Activer session
                const userId = tg.initDataUnsafe?.user?.id;
                const result = await activateSession(userId, tg.initData);
                
                if (result.success) {
                    // Succès !
                    document.getElementById('monetagSection').classList.add('hidden');
                    document.getElementById('successSection').classList.remove('hidden');
                    document.getElementById('durationText').textContent = result.duration + ' minutes';
                    
                    tg.showAlert('✅ Accès débloqué pour ' + result.duration + ' min !');
                } else {
                    throw new Error('Erreur serveur');
                }
                
            } catch (error) {
                console.error(error);
                loader.classList.add('hidden');
                btn.classList.remove('hidden');
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Veuillez regarder la pub jusqu\'à la fin';
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            if (!tg) {
                alert('Ouvrir via Telegram');
                return;
            }
            tg.expand();
            tg.ready();
        });
    </script>
</body>
</html>
